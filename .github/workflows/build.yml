name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Keystore
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KS_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Execution failed|FAILED" -A2 build.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk Weather.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Weather
          path: Weather.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Weather.apk \
            --title "Weather 1.0.${{ github.run_number }}" \
            --notes "Android 5.0+ · no ads · no trackers · data: Open-Meteo.com"
